<html>
<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Container v04 · Online</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: linear-gradient(-45deg, #0f2027, #203a43, #2c5364, #1a2980);
    background-size: 400% 400%;
    animation: gradientShift 14s ease infinite;
    overflow: hidden;
    position: relative;
  }

  @keyframes gradientShift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(60px);
    opacity: 0.35;
    animation: float 10s ease-in-out infinite;
  }
  .blob.one   { width: 320px; height: 320px; background: #00c9a7; top: -80px; left: -80px; animation-delay: 0s; }
  .blob.two   { width: 260px; height: 260px; background: #845ec2; bottom: -60px; right: -60px; animation-delay: 2s; }
  .blob.three { width: 200px; height: 200px; background: #ff6f91; bottom: 20%; left: 10%; animation-delay: 4s; }

  @keyframes float {
    0%, 100% { transform: translateY(0) translateX(0); }
    50%      { transform: translateY(-30px) translateX(20px); }
  }

  .card {
    position: relative;
    z-index: 2;
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid rgba(255, 255, 255, 0.18);
    border-radius: 24px;
    padding: 56px 64px;
    text-align: center;
    color: #f5f7fa;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    animation: fadeInUp 1s ease both;
    max-width: 480px;
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #00e5a0;
    background: rgba(0, 229, 160, 0.12);
    border: 1px solid rgba(0, 229, 160, 0.4);
    padding: 6px 14px;
    border-radius: 999px;
    margin-bottom: 22px;
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #00e5a0;
    box-shadow: 0 0 0 0 rgba(0, 229, 160, 0.6);
    animation: pulse 1.6s infinite;
  }

  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(0, 229, 160, 0.6); }
    70%  { box-shadow: 0 0 0 10px rgba(0, 229, 160, 0); }
    100% { box-shadow: 0 0 0 0 rgba(0, 229, 160, 0); }
  }

  .icon {
    font-size: 48px;
    margin-bottom: 18px;
    animation: bob 3s ease-in-out infinite;
  }

  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50%      { transform: translateY(-10px) rotate(4deg); }
  }

  h1 {
    font-size: 28px;
    font-weight: 600;
    margin-bottom: 10px;
    letter-spacing: -0.01em;
  }

  p {
    font-size: 15px;
    line-height: 1.6;
    color: rgba(245, 247, 250, 0.75);
    margin-bottom: 28px;
  }

  .meta {
    display: flex;
    justify-content: center;
    gap: 20px;
    flex-wrap: wrap;
    font-family: 'Consolas', 'Courier New', monospace;
    font-size: 12.5px;
    color: rgba(245, 247, 250, 0.55);
    border-top: 1px solid rgba(255, 255, 255, 0.12);
    padding-top: 20px;
  }

  .meta span strong {
    color: #00e5a0;
    font-weight: 600;
  }
</style>
</head>
<body>

  <div class="blob one"></div>
  <div class="blob two"></div>
  <div class="blob three"></div>

  <div class="card">
    <div class="badge"><span class="dot"></span> Container ativo</div>
    <div class="icon">🐳</div>
    <h1>Terceiro container no ar, v04</h1>
    <h2>Novo container com mysql</h2>
    <p>Essa página está sendo servida de dentro de um container Docker próprio, isolado do nginx padrão — prova de que o build e o roteamento de porta funcionaram.</p>
    <div class="meta">
      <span>host: <strong>localhost:8084</strong></span>
      <span>server: <strong>nginx</strong></span>
      <span>status: <strong>200 OK</strong></span>
    </div>
  </div>

</body>
</html>
